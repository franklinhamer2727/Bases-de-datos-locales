# Configuracion fija. Password y maxmemory se pasan desde docker-compose.yml (.env).
bind 0.0.0.0 -::*
protected-mode yes
port 6379
dir /data

# Persistencia: AOF (pierde como mucho ~1 s) + snapshots RDB.
appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000

# Al llegar a maxmemory: noeviction = rechaza escrituras (Redis como almacen).
# Para uso como cache cambie a allkeys-lru.
maxmemory-policy noeviction

loglevel notice
timeout 0
tcp-keepalive 300
